services:
  postgres:
    image: postgres:16-alpine
    container_name: showscore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: showscore
      POSTGRES_PASSWORD: showscore
      POSTGRES_DB: showscore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: showscore_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: showscore_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery_worker:
    build: ./backend
    container_name: showscore_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
      - postgres

  celery_beat:
    build: ./backend
    container_name: showscore_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
      - postgres

  frontend:
    build: ./frontend
    container_name: showscore_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
